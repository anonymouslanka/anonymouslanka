<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2ea" />
    <title>Offline · Detective Lanka</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f6f2ea; color: #1c2541; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 360px; text-align: center; }
      img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 12px 30px -12px rgba(28,37,65,.5); }
      h1 { font-family: ui-serif, Georgia, serif; font-size: 26px; margin: 22px 0 8px; }
      p { color: #5b5f73; line-height: 1.55; margin: 0 0 22px; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 22px; color: #fff; background: linear-gradient(#e43f63, #a81f40); box-shadow: 0 8px 20px -8px rgba(168,31,64,.55); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="84" height="84" />
      <h1>You are offline</h1>
      <p>Detective Lanka needs a connection to load case files. Cases you opened recently may still be available once the app reconnects.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
